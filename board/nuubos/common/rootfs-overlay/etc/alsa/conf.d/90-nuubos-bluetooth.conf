# nuubOS fixed-format Bluetooth playback PCM
#
# Keep the BlueALSA transport at stereo / 44.1 kHz and convert application
# audio in ALSA before it reaches the raw BlueALSA PCM.

pcm.nuubos-bluetooth {
	type plug

	slave {
		pcm {
			type bluealsa
			device "00:00:00:00:00:00"
			profile "a2dp"
		}

		rate 44100
		channels 2
	}
}

namehint.pcm {
	nuubos-bluetooth "nuubos-bluetooth|nuubOS Bluetooth Audio|IOIDOutput"
}
