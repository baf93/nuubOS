image nuubos-boot.vfat {
	vfat {
		label = "NUUBOS_BOOT"

		files = {
			"nuubos.cfg"
		}
	}

	size = 16M
}

image state.ext4 {
	ext4 {
		use-mke2fs = true
		label = "NUUBOS_STATE"
	}

	size = 128M
	empty = true
}

image nuubOS-anbernic-h700.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1000K
	}

	partition rootfs {
		offset = 1M
		partition-type = 0x83
		bootable = "true"
		image = "rootfs.ext4"
	}

	partition boot {
		partition-type = 0x0c
		image = "nuubos-boot.vfat"
	}

	partition state {
		partition-type = 0x83
		image = "state.ext4"
	}
}
