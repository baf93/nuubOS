# Product Audio streams own their own software gain in nuubos-audiod.
# Keep them at unity even when the global Applications volume is below 100%.
stream.rules = [
  {
    matches = [
      { application.process.binary = "nuubos-audio-wav-player" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
        state.default-volume = 1.0
      }
    }
  }
]
