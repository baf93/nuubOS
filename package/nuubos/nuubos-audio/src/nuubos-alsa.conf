</usr/share/alsa/alsa.conf>

# Standard PipeWire endpoint for Product Audio. The socket path is absolute so
# callers do not depend on inheriting XDG_RUNTIME_DIR from a desktop session.
defaults.pipewire.server "/run/nuubos/pipewire/pipewire-0"

pcm.nuubos_pipewire {
    type pipewire
    server "/run/nuubos/pipewire/pipewire-0"
    hint.description "nuubOS PipeWire audio"
}

ctl.nuubos_pipewire {
    type pipewire
    server "/run/nuubos/pipewire/pipewire-0"
}
