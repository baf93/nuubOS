# nuubOS system-wide ALSA compatibility endpoint.
# Ordinary ALSA applications using "default" enter the PipeWire graph.
defaults.pipewire.server "/run/nuubos/pipewire/pipewire-0"

pcm.!default {
    type pipewire
    server "/run/nuubos/pipewire/pipewire-0"
    hint {
        show on
        description "nuubOS PipeWire Default"
    }
}

ctl.!default {
    type pipewire
    server "/run/nuubos/pipewire/pipewire-0"
}
