# Standard Linux ALSA default -> PipeWire.
# Applications using ALSA "default" enter the same graph as Product Audio.
defaults.pipewire.server "/run/nuubos/pipewire/pipewire-0"

pcm.!default {
    type pipewire
    server "/run/nuubos/pipewire/pipewire-0"
}

ctl.!default {
    type pipewire
    server "/run/nuubos/pipewire/pipewire-0"
}
