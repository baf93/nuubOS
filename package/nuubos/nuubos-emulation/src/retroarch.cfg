# nuubOS RetroArch defaults for Allwinner H700 (EPIC-013).
#
# Copied once into each user's configuration
# (/userdata/users/<id>/appdata/retroarch/retroarch.cfg) the first time the
# user plays; changes made in RetroArch Advanced are kept. Paths, drivers,
# controller ports, the command interface and the language are not set
# here: nuubos-emud enforces them at every launch.

# Video: Panfrost GLES, vsync, no threaded video (latency). Pixel perfect:
# square pixels, smart integer scale (never non-integer, RetroArch patch
# 0003), picture at the top of the screen. nuubos-emud enforces the
# presentation at every launch (Settings -> Gaming, per-game settings);
# these are the same values for RetroArch Advanced.
video_vsync = "true"
video_threaded = "false"
video_hard_sync = "false"
video_frame_delay = "0"
video_smooth = "false"
video_scale_integer = "true"
video_scale_integer_scaling = "2"
aspect_ratio_index = "21"
video_viewport_bias_x = "0.500000"
video_viewport_bias_y = "0.000000"
video_shader_enable = "false"
video_gpu_screenshot = "true"
video_font_enable = "false"
fps_show = "false"

# Audio: through PipeWire's ALSA default, 64 ms buffer, cheap resampler
# (Cortex-A53), muted while fast-forwarding.
audio_driver = "alsa"
audio_device = ""
audio_latency = "64"
audio_out_rate = "48000"
audio_sync = "true"
audio_resampler = "sinc"
audio_resampler_quality = "2"
audio_enable_menu = "false"
audio_fastforward_mute = "true"
fastforward_ratio = "3.000000"

# Saves: in-game saves flushed every 10 s (power loss safety), states
# compressed with a thumbnail. The automatic state (save on close, resume
# on start) is enforced per session by nuubos-emud.
autosave_interval = "10"
block_sram_overwrite = "false"
save_file_compression = "false"
savestate_file_compression = "true"
savestate_thumbnail_enable = "true"
savestate_auto_index = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"

# Costly features stay off by default on H700.
rewind_enable = "false"
run_ahead_enabled = "false"
preemptive_frames_enable = "false"
cheevos_enable = "false"
input_overlay_enable = "false"
history_list_enable = "false"

# Input: up to 8 players (nuubOS players), left stick drives the D-pad for
# cores without analog input.
input_max_users = "8"
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"
input_player3_analog_dpad_mode = "1"
input_player4_analog_dpad_mode = "1"
input_player5_analog_dpad_mode = "1"
input_player6_analog_dpad_mode = "1"
input_player7_analog_dpad_mode = "1"
input_player8_analog_dpad_mode = "1"

# RetroArch Advanced menu: Ozone, dark theme, pauses the game. Reboot and
# Shut Down are nuubOS lifecycle actions (Power menu), not RetroArch's.
menu_driver = "ozone"
ozone_menu_color_theme = "1"
menu_pause_libretro = "true"
menu_show_reboot = "false"
menu_show_shutdown = "false"
menu_show_restart_retroarch = "false"
menu_show_core_updater = "true"
menu_show_legacy_thumbnail_updater = "false"

# Additional cores (Online Updater -> Core Downloader).
core_updater_buildbot_cores_url = "https://buildbot.libretro.com/nightly/linux/aarch64/latest/"
core_updater_auto_extract_archive = "true"
core_updater_show_experimental_cores = "false"
