# nuubOS screen type of each system (nuubos-emud, EPIC-013).
#
#   system|screen[|hdmi_lines]
#
# hdmi_lines (optional): lines RetroArch renders a game of the system at on
# HDMI, scaled to the TV mode by the display engine; missing = 360 (N64 at
# full speed), 0 = native resolution. 480 gives 240p content the CRT look's
# 2x scanlines: raise it per system only after measuring full speed.
#
# crt       TV or monitor with visible scanlines at low resolution: the CRT
#           look applies (Settings -> Gaming -> CRT Effect), TV bezel.
# lcd       handheld screen: never the CRT look, handheld bezel.
# monitor   high resolution / VGA / vector display: no CRT look, TV bezel.
#
# Systems missing here are "monitor". Bezel colours come from systems.conf.
