# nuubOS BIOS requirements per system (EPIC-033), read by nuubos-biosctl.
#
# <system>|<mode>|<file>[,<file>...]   (paths relative to /userdata/bios)
#   required  every listed file is needed
#   any       one of the listed variants (regions/revisions) is needed
#   optional  the emulator runs without them (HLE) but uses them
#   none      the system needs no firmware: not listed in the BIOS Manager
#
# Systems not listed here use the firmware list of their core's libretro
# core-info file as published. The curated lines exist because cores that
# emulate several systems (Genesis Plus GX, FinalBurn Neo, Flycast...)
# publish one list for all of them, all marked optional. MD5 references
# always come from the core-info files; nothing here is a firmware image.
nes|none|
fds|required|disksys.rom
snes|none|
satellaview|required|BS-X.bin
sufami|required|STBIOS.bin
gb|optional|gb_bios.bin
gbc|optional|gbc_bios.bin
gba|optional|gba_bios.bin
nds|optional|bios7.bin,bios9.bin,firmware.bin
n64|none|
mastersystem|optional|bios_E.sms,bios_U.sms,bios_J.sms
megadrive|none|
segacd|any|bios_CD_E.bin,bios_CD_U.bin,bios_CD_J.bin
sega32x|none|
gamegear|optional|bios.gg
sg1000|none|
saturn|required|saturn_bios.bin
dreamcast|optional|dc/dc_boot.bin
naomi|required|dc/naomi.zip
atomiswave|required|dc/awbios.zip
psx|optional|scph5501.bin,scph5500.bin,scph5502.bin
psp|none|
pcengine|none|
pcecd|any|syscard3.pce,syscard2.pce,syscard1.pce
neogeo|required|fbneo/neogeo.zip
geolith|any|neogeo.zip,aes.zip
neogeocd|any|neocd/neocd_z.rom,neocd/neocd.bin,neocd/top-sp1.bin,neocd/front-sp1.bin
arcade|none|
fbneo|none|
cps1|none|
cps2|none|
cps3|none|
mame|none|
atari5200|required|5200.rom
atari7800|optional|7800 BIOS (U).rom
atari800|optional|ATARIXL.ROM,ATARIOSB.ROM,ATARIBAS.ROM
atarixe|optional|ATARIXL.ROM,XEGAME.ROM
atarist|optional|tos.img
amiga|optional|kick34005.A500,kick37175.A500,kick40068.A1200
c64|none|
c128|none|
plus4|none|
vic20|none|
lynx|optional|lynxboot.img
coleco|required|colecovision.rom
channelf|required|sl31253.bin,sl31254.bin
intellivision|required|exec.bin,grom.bin
odyssey2|required|o2rom.bin
macintosh|required|MacII.ROM
pc88|required|quasi88/n88.rom,quasi88/n88_0.rom,quasi88/n88_1.rom,quasi88/n88_2.rom,quasi88/n88_3.rom,quasi88/n88n.rom,quasi88/disk.rom
pc98|required|np2kai/bios.rom,np2kai/FONT.ROM,np2kai/itf.rom,np2kai/sound.rom
x68000|required|keropi/iplrom.dat,keropi/cgrom.dat
palm|any|palmos40-en-m500.rom,palmos41-en-m515.rom,palmos52-en-t3.rom,palmos60-en-t3.rom
pokemini|optional|bios.min
msx|none|
scummvm|none|
zxspectrum|none|
