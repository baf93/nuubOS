# nuubOS emulation core matrix (EPIC-013).
#
#   system|core[,core...]
#
# system: id from /usr/share/nuubos/systems.conf. Cores are libretro core
# names (<core>_libretro.so) in order of preference. nuubos-emud uses the
# first one bundled in /usr/lib/libretro (the cores qualified for H700 and
# shipped with nuubOS); if none is bundled, the first one the user
# downloaded with the RetroArch Online Updater (/userdata/retroarch/cores).
#
# MAME-only machines add two fields: the MAME machine and the media switch
# per file extension (first entry = default), e.g. "apple2e|dsk:-flop1":
# nuubos-emud starts them through a generated .cmd file. Their system ROMs
# go in /userdata/bios/mame/bios/<machine>.zip.
#
# N64, NDS, Saturn, Dreamcast and PSP are bundled for the part of their
# library H700 runs well (light 3D titles); the heaviest games stay out of
# reach of the hardware whatever the core.

