[package]
name = "nuubos-quick-menu"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "MIT"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-18"] }
wayland-client = "=0.31.15"
# libwayland-client backend: EGL (wl_egl_window) needs the C wl_display/wl_surface.
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
glutin = { version = "=0.32.3", default-features = false, features = ["egl", "wayland"] }
raw-window-handle = "=0.6.2"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
