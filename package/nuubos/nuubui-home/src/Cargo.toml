[package]
name = "nuubui-home"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "MIT"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-18"] }
zbus = "=5.19.0"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

# i-slint-core with the nuubOS patches, unpacked here by the package's
# POST_RSYNC hook (patches/packages/i-slint-core).
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
