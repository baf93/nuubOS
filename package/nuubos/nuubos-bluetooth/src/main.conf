# nuubOS BlueZ configuration (installed by nuubos-bluetooth over BlueZ's
# default). Only what differs from BlueZ's defaults is set here.
#
# Kept at the defaults on purpose (Bluetooth audit 2026-11-11):
# - JustWorksRepairing = never: nuubos-bluetoothd's agent only accepts a
#   pairing the user started from nuubOS; a controller that lost its keys
#   is paired again from Settings.
# - [LE] connection intervals: game controllers ask for their own interval
#   (7.5 ms typical); a shorter default would only add Bluetooth airtime,
#   which the RTL8821CS shares with Wi-Fi (connectivity.md).
# - FastConnectable = false: interlaced page scan costs airtime and power
#   all the time for a slightly faster controller reconnection.

[General]
# Name other devices see (BlueZ's default is "BlueZ <version>").
Name = nuubOS
