# nuubOS Web administration (EPIC-038). Every request needs the device
# credential (HTTP Digest, user root, realm nuubOS). The API is one CGI
# that only calls the product services and only touches /userdata/roms
# and /userdata/bios.
server.modules = ( "mod_access", "mod_auth", "mod_authn_file", "mod_alias",
                   "mod_cgi", "mod_setenv" )
server.document-root = "/usr/share/nuubos/web"
server.port = 80
server.pid-file = "/var/run/nuubos-web.pid"
server.errorlog = "/run/nuubos/web.log"
server.upload-dirs = ( "/userdata/.nuubos-upload" )
# Disc images can be large; the body is streamed to the upload folder.
server.max-request-size = 8388608
server.stream-request-body = 2
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/html; charset=utf-8",
                    ".js" => "text/javascript; charset=utf-8",
                    ".css" => "text/css; charset=utf-8",
                    ".svg" => "image/svg+xml" )
auth.backend = "htdigest"
auth.backend.htdigest.userfile = "/state/remote/web.htdigest"
auth.require = ( "/" => ( "method" => "digest", "realm" => "nuubOS",
                          "require" => "valid-user", "algorithm" => "MD5" ) )
alias.url = ( "/api" => "/usr/lib/nuubos/web/api.cgi" )
cgi.assign = ( ".cgi" => "" )
setenv.add-response-header = (
    "X-Frame-Options" => "DENY",
    "X-Content-Type-Options" => "nosniff",
    "Referrer-Policy" => "no-referrer",
    "Content-Security-Policy" => "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:",
    "Cache-Control" => "no-store" )
