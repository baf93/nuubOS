[package]
name = "nuubos-admind"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "nuubos-admind"
path = "admind/main.rs"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = "=1.0.229"
serde_json = "=1.0.151"
zbus = "=5.19.0"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
opt-level = "s"
