# nuubOS SMB file sharing (EPIC-037), served by the kernel ksmbd server.
# One share: the user storage (ROMs, BIOS, saves, screenshots...). SYSTEM
# and STATE are never shared. Login: the device credential, user root.
[global]
	server string = nuubOS
	netbios name = NUUBOS
	workgroup = WORKGROUP
	server min protocol = SMB2_10
	map to guest = never
	restrict anonymous = 2
	smb2 leases = yes

[nuubOS]
	comment = nuubOS user storage
	path = /userdata
	read only = no
	browseable = yes
	guest ok = no
	valid users = root
	force user = root
	veto files = /.nuubos-upload/
