# nuubOS system registry (EPIC-012 US-DISC-015).
#
# One line per supported system:
#   id|display name|folder|extensions|cover aspect|colour|folder aliases
#
# - ROMs live anywhere under /userdata/roms. A file belongs to the system
#   of its nearest folder named after that system (folder, id, display
#   name or an alias; case, spaces and punctuation are ignored), else to
#   the only system taking its extension, else (shared disc/cartridge
#   formats) to the system identified from its header. /userdata/roms/
#   <folder> is created for every system.
# - extensions: comma separated, case-insensitive, may contain dots
#   ("p8.png"). Archives are listed only where the backend loads them.
#   .m3u/.cue descriptors hide the files they reference.
# - cover aspect: width/height of the usual box art front x1000, used for
#   the card shape when a game has no cover of its own (a real cover keeps
#   its own proportions).
# - colour: system accent (carried in the Home card model; the minimal Home
#   draws neutral tiles and does not paint it).
# - icon: /usr/share/nuubos/systems/<id>.png when present.
#
# Shared cover art: /userdata/library/covers/<id>/<rom name>.png|jpg, or a
# media/covers folder next to the ROM (named like the ROM without its
# extension).

