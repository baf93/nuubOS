# RG40XX V physical qualification regression profile.
# Enable only modules whose applicable qualification boundary has been
# explicitly defined for this device.

EXPECTED_ARCH="aarch64"
EXPECTED_KERNEL_PREFIX="7.2"
EXPECTED_MODEL="Anbernic RG40XX V"
EXPECTED_COMPATIBLE="anbernic,rg40xx-V"
PROFILE_ENABLED_MODULES="H0 H1 H2 H3 H4 H5 H6 H8"

# H1 display/GPU qualification boundary

HAS_INTERNAL_LCD=1
REQUIRE_HDMI_CONNECTED=0

DRM_CARD="/dev/dri/card0"
DRM_RENDER="/dev/dri/renderD128"
HDMI_STATUS_GLOB="/sys/class/drm/card0-HDMI-A-*/status"

DISPLAY_IOMMU_DEVICE="1280000.mixer"
CEDRUS_IOMMU_DEVICE="1c0e000.video-codec"

INTERNAL_LCD_STATUS_GLOB="/sys/class/drm/card0-Unknown-*/status"
BACKLIGHT_DEVICE="/sys/class/backlight/backlight"
BACKLIGHT_EXPECT_MAX=100


# H4 RTL8821CS radio qualification.

WIFI_INTERFACE="wlan0"
WIFI_EXPECT_POWER_SAVE="off"
WIFI_EXPECT_DISABLE_LPS_DEEP="Y"


# H5 input expectations

INPUT_MIN_EVENT_NODES=6
INPUT_POWER_NAME="axp20x-pek"
INPUT_ANALOG_NAME="adc-joystick"
INPUT_GAMEPAD_NAME="gpio-keys-gamepad"
INPUT_VOLUME_NAME="gpio-keys-volume"

INPUT_ANALOG_POLL_MS=4

# RG40XX-V has one physical stick only.
INPUT_HAS_RIGHT_STICK=0
INPUT_HAS_L3=1
INPUT_HAS_R3=0

# ADC joystick nominal range 0..4096.
INPUT_ANALOG_LOW_MAX=1200
INPUT_ANALOG_HIGH_MIN=2800
INPUT_INTERACTIVE_TIMEOUT=10

# Bluetooth HOG userspace input path.
INPUT_REQUIRE_UHID=1

# Built-in PWM vibration motor.
INPUT_REQUIRE_INTERNAL_RUMBLE=1
INPUT_INTERNAL_RUMBLE_NAME="pwm-vibrator"

# Full physical key/stick acceptance.
INPUT_ENABLE_PHYSICAL_ACCEPTANCE=1

# Optional external-controller FF is outside this device gate.
INPUT_ENABLE_FF_RUMBLE_CHECK=0

# H8 RGB lighting
HAS_RGB=1
RGB_DEVICE_ID="rg40xx-v"
RGB_LED_COUNT=8
RGB_ZONE_COUNT=1
RGB_ZONE0="stick:ring:8"
RGB_EXPECT_BOOT_OFF=1
RGB_PHYSICAL_ACCEPTANCE=1

# H2 audio qualification boundary
AUDIO_REQUIRE_ANALOG=1
AUDIO_REQUIRE_HDMI=0
AUDIO_ANALOG_CARD=0

# Physical analog-audio acceptance completed:
# internal speaker, headphone playback, jack auto-mute and restore.
AUDIO_ANALOG_PHYSICAL_ACCEPTANCE=1

USB_REQUIRE_OTG=1
